import java.util.Properties

plugins {
    id 'com.android.application'
}

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { stream ->
        versionProps.load(stream)
    }
} else {
    versionProps.setProperty('VERSION_CODE', '22')
    versionProps.setProperty('VERSION_NAME', '2.0.0')
    versionPropsFile.withOutputStream { stream ->
        versionProps.store(stream, null)
    }
}

def appVersionCode = versionProps.getProperty('VERSION_CODE', '22').toInteger()
def appVersionName = versionProps.getProperty('VERSION_NAME', '2.0.0')

android {
    namespace 'com.xiaohei.fishlight'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xiaohei.fishlight'
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/keystore/xiaohei-release.jks")
            storePassword 'xiaohei123'
            keyAlias 'xiaohei'
            keyPassword 'xiaohei123'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
