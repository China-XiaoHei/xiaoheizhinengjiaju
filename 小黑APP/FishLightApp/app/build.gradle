import java.util.Properties

plugins {
    id 'com.android.application'
}

def defaultVersionCode = 22
def defaultVersionName = '2.0.0'
def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { stream ->
        versionProps.load(stream)
    }
} else {
    versionProps.setProperty('VERSION_CODE', defaultVersionCode.toString())
    versionProps.setProperty('VERSION_NAME', defaultVersionName)
    versionPropsFile.withOutputStream { stream ->
        versionProps.store(stream, null)
    }
}

def incrementPatchVersion = { String versionName ->
    def parts = versionName.tokenize('.').collect { it as int }
    while (parts.size() < 3) {
        parts << 0
    }
    parts[2] = parts[2] + 1
    return "${parts[0]}.${parts[1]}.${parts[2]}"
}

def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def shouldAutoIncrementVersion = requestedTasks.any { taskName ->
    taskName.contains('release') && (
        taskName.contains('assemble') ||
        taskName.contains('bundle') ||
        taskName.contains('package')
    )
}

def storedVersionCode = versionProps.getProperty('VERSION_CODE', defaultVersionCode.toString()).toInteger()
def storedVersionName = versionProps.getProperty('VERSION_NAME', defaultVersionName)
def appVersionCode = shouldAutoIncrementVersion ? (storedVersionCode + 1) : storedVersionCode
def appVersionName = shouldAutoIncrementVersion ? incrementPatchVersion(storedVersionName) : storedVersionName

android {
    namespace 'com.xiaohei.fishlight'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xiaohei.fishlight'
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/keystore/xiaohei-release.jks")
            storePassword 'xiaohei123'
            keyAlias 'xiaohei'
            keyPassword 'xiaohei123'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                outputFileName = "小黑APP-鱼缸控制-v${variant.versionName}-release.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}

afterEvaluate {
    tasks.named('assembleRelease').configure {
        doLast {
            def outputDir = new File(rootDir.parentFile, 'output')
            outputDir.mkdirs()

            copy {
                from(layout.buildDirectory.dir('outputs/apk/release'))
                include('*.apk')
                into(outputDir)
            }

            if (shouldAutoIncrementVersion) {
                versionProps.setProperty('VERSION_CODE', appVersionCode.toString())
                versionProps.setProperty('VERSION_NAME', appVersionName)
                versionPropsFile.withOutputStream { stream ->
                    versionProps.store(stream, null)
                }
            }
        }
    }
}
